<script>
  (function () {
    try {
      var mo = new Date().getMonth() + 1;
      var se = mo < 3 ? 'winter' : mo < 6 ? 'spring' : mo < 9 ? 'summer' : mo < 12 ? 'autumn' : 'winter';
      var savedSe = localStorage.getItem('season');
      if (savedSe && ['spring', 'summer', 'autumn', 'winter'].indexOf(savedSe) >= 0) se = savedSe;
      document.documentElement.dataset.season = se;
      var hh = new Date().getHours();
      document.documentElement.dataset.phase =
        (hh >= 6 && hh < 17) ? 'day' : (hh >= 17 && hh < 19) ? 'dusk' :
        (hh >= 19 && hh < 23) ? 'night' : 'late';
    } catch (e) {}
  })();
</script>
